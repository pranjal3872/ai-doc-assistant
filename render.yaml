services:
  # RAG Service (Python / FastAPI)
  - type: web
    name: ai-doc-rag-service
    env: python
    plan: free
    rootDir: rag-service
    buildCommand: pip install torch --extra-index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: RAG_INTERNAL_KEY
        generateValue: true
      # Hosted Qdrant (e.g. Qdrant Cloud). Render's disk is wiped on every
      # deploy, so without these all uploaded documents are lost.
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

  # Backend API (Node.js / Express / Prisma)
  - type: web
    name: ai-doc-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      # Public https URL of ai-doc-rag-service (free services can't use private networking)
      - key: RAG_SERVICE_URL
        sync: false
      - key: RAG_INTERNAL_KEY
        fromService:
          type: web
          name: ai-doc-rag-service
          envVarKey: RAG_INTERNAL_KEY
      - key: FRONTEND_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false

